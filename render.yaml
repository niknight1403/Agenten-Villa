# Render Blueprint: Agenten Villa als kostenloser Web-Service (Client + API in einem Docker-Container)
# Schritt-für-Schritt-Anleitung: docs/DEPLOY.md
services:
  - type: web
    name: agenten-villa
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # PostgreSQL-Verbindung (Neon) – in docs/DEPLOY.md
      - key: DATABASE_URL
        sync: false
      # Admin-Allowlist (deine E-Mail)
      - key: AGENT_ADMIN_EMAIL
        sync: false
      # Kostenloser Modellanbieter: https://openrouter.ai/keys
      - key: OPENROUTER_API_KEY
        sync: false
      # Required for administrator Elite missions on protected agent/* branches.
      - key: GITHUB_TOKEN
        sync: false
      # Sprint 102 — Eigene Ollama-Route auf Oracle Cloud Always Free
      # (unbegrenzte Tokens, keine Abrechnung). Wird ueber den
      # GitHub-Workflow .github/workflows/route-smoke-sync.yml aus den
      # GitHub-Secrets (VILLA_OLLAMA_TOKEN) nach Render synchronisiert.
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_TIMEOUT_MS
        sync: false
      # Optional model fallback; only used after explicit activation.
      - key: HF_TOKEN
        sync: false
      # Google OAuth (Account-System) – siehe docs/DEPLOY.md
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Oeffentliche Basis-URL der App. Pinnt die Google-Redirect-URI, damit sie
      # unabhaengig von Proxy-Headern exakt der in der Google Cloud Console
      # registrierten entspricht. Leer = aus den Request-Headern ableiten.
      - key: PUBLIC_BASE_URL
        sync: false
