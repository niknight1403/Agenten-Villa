# Agenten Villa auf eigenem Server mit eigener Domain (cybersarah-ki.com)
# Anleitung: docs/SERVER-DEPLOY.md
services:
  villa:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - villa

volumes:
  caddy_data:
  caddy_config:
