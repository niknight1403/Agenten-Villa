name: Generate signing keystore

# Einmalig ausloesbar: erzeugt einen Release-Signaturschluessel und laedt ihn
# als kurzlebiges Artifact hoch. Der Keystore wird danach NICHT im Repository
# gespeichert, sondern nur verschluesselt in den GitHub Secrets.
# Wichtig: Das Artifact einmal herunterladen und sicher verwahren (Backup),
# solange es existiert. Bei Verlust kann der Workflow erneut gestartet werden.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate keystore and credentials
        run: |
          mkdir -p signing
          PW=$(openssl rand -base64 24 | tr -d '=+/' | head -c 28)
          keytool -genkeypair -v \
            -keystore signing/agenten-villa.keystore \
            -storetype PKCS12 \
            -alias agenten-villa \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=Agenten Villa, OU=Mobile, O=Agenten Villa, L=Frankfurt, S=Hessen, C=DE"
          printf '%s' "$PW" > signing/keystore-password.txt

      - uses: actions/upload-artifact@v4
        with:
          name: agenten-villa-signing-keystore
          path: signing/
          retention-days: 7
