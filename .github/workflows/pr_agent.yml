name: PR Agent (Gemini)

# KI-Code-Review via PR-Agent (Open Source, The-PR-Agent) mit dem
# Repo-Secret GEMINI_API_KEY (Google AI Studio, Kontingent kostenlos).
# Portiert aus dem CyberSarah-Control-Center (dort seit Sprint 92 bewaehrt).
# Ersetzt eine CodeRabbit-Anmeldung: kein externes Konto, keine GitHub App.
# - Bei neuen PRs und bei jedem neuen Commit auf einem offenen PR laeuft
#   automatisch /describe, /review und /improve (synchronize-Trigger).
# - Bot-Pushs (z. B. Dependabot) bleiben weiterhin ausgespart.
# - In jedem PR sind interaktive Kommentare moeglich: /review, /improve,
#   /ask "...", /describe, /update_changelog.
# - PRs von Bots (z. B. Dependabot) werden vom Sender-Guard uebersprungen
#   (github.event.sender.type != 'Bot') — schont das Gemini-Kontingent.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:

permissions:
  issues: write
  pull-requests: write
  contents: write

concurrency:
  # Serialisiert Runs pro PR, bricht aber NIE laufende Reviews ab:
  # Bot-Kommentare (z. B. CodeRabbit) feuern issue_comment-Events in
  # dieselbe Gruppe und haben mit cancel-in-progress den laufenden
  # Review immer abgebrochen, bevor er fertig wurde.
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' && (github.event_name != 'issue_comment' || github.event.issue.pull_request) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: KI-Review durch PR-Agent
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Gemini (Google AI Studio) — Key liegt als Repo-Secret bereit.
          config.model: "gemini/gemini-3.8-flash"
          config.fallback_models: '["gemini/gemini-3.5-flash", "gemini/gemini-flash-latest"]'
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Automatische Werkzeuge bei neuen PRs:
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "review_requested", "synchronize"]'
          # Projektkonventionen (Deutsch, Repo-Stil):
          pr_reviewer.extra_instructions: "Das Projekt nutzt deutsche, konventionelle Commit- und PR-Titel ('fix(build-apk): ...', 'docs: ...'). Antworte auf Deutsch. Achte auf: keine Secrets im Code, Node 22 + pnpm (nicht npm/yarn), Neon-Postgres via drizzle-orm als Datenbank (drizzle/schema.ts ist Quelle der Wahrheit), Deploy als Render-Web-Service (kein Docker), android/ ist Quelle der Wahrheit fuer Natives."
          pr_description.extra_instructions: "Beschreibe den PR auf Deutsch, klar und sachlich, passend zum Stil der Doku in docs/."
          pr_description.publish_labels: "false"
