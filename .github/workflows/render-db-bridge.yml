name: render-db-bridge

# Neon-Quota-Bruecke (2026-10-18): Das Neon-Kontingent (SQLSTATE 53000) ist
# erschöpft — die Agenten-Villa-DB ist dauerhaft erreichbar? Nein: abgeschaltet
# bis Monatsreset. Dieser Workflow stellt EINE kostenlose Render-Postgres
# (gleiche Region wie der Web-Service) bereit, wendet die Drizzle-Migrationen
# an und tauscht ausschliesslich DATABASE_URL in der Render-Env des Services.
# Rollback: DATABASE_URL zurueck auf Neon setzen (z. B. nach dem 01.11.).
# Werte verlassen nie die GitHub-Runner; Logs maskieren Verbindungsdaten.

on:
  workflow_dispatch: {}

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Free-Postgres anlegen, migrieren, DATABASE_URL schwenken, deployen
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          GH_PAT: ${{ secrets.SERVER_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SVC="srv-dar9h6id0e5s73c0c050"
          API=https://api.render.com/v1
          RAUTH="Authorization: Bearer $RENDER_API_KEY"

          echo "== [1/6] Region des Web-Services =="
          REGION=$(curl -sf -H "$RAUTH" "$API/services/$SVC" | jq -r '.region // "ohio"')
          echo "Region: $REGION"

          echo "== [2/6] Free-Postgres suchen (Idempotenz + Fremdbelegungsschutz) =="
          DBS=$(curl -sf -H "$RAUTH" "$API/databases?limit=100")
          OWNED=$(echo "$DBS" | jq -r '.[] | select(.name=="agenten-villa-db") | .id' | head -1)
          FOREIGN=$(echo "$DBS" | jq -r '.[] | select(.plan=="free" and .name!="agenten-villa-db") | .name' | head -1)
          if [ -n "$FOREIGN" ]; then
            echo "ABBRUCH: Account hat bereits eine fremde Free-Postgres ($FOREIGN) — Free-Slot belegt. Nicht anfassen."
            exit 1
          fi
          if [ -n "$OWNED" ]; then
            DBID="$OWNED"
            echo "Vorhandene agenten-villa-db wiederverwendet: $DBID"
          else
            DBID=$(curl -sf -X POST -H "$RAUTH" -H "Content-Type: application/json" "$API/databases" \
              -d "{\"name\":\"agenten-villa-db\",\"plan\":\"free\",\"region\":\"$REGION\"}" | jq -r '.id')
            echo "Neue Free-Postgres angelegt: $DBID"
          fi

          echo "== [3/6] Auf Verfuegbarkeit warten =="
          NEWURL=""
          for i in $(seq 1 20); do
            DET=$(curl -sf -H "$RAUTH" "$API/databases/$DBID")
            ST=$(echo "$DET" | jq -r '.availabilityStatus // .state // "?"')
            echo "  Status: $ST"
            if [ "$ST" = "available" ]; then
              NEWURL=$(echo "$DET" | jq -r '.connection_info.internal_database_url // .connection_info.external_database_url // .connection_info.external_connection_string // empty')
              break
            fi
            sleep 20
          done
          if [ -z "$NEWURL" ]; then echo "ABBRUCH: DB nicht verfuegbar geworden."; exit 1; fi
          echo "  Verbindungs-Host: $(echo "$NEWURL" | sed -E 's#.*@#<maskiert>@#')"

          echo "== [4/6] Drizzle-Migrationen gegen die neue DB =="
          pnpm install --frozen-lockfile >/dev/null 2>&1 || pnpm install >/dev/null 2>&1
          DATABASE_URL="$NEWURL" pnpm db:push
          echo "Migrationen angewendet."

          echo "== [4b/6] GitHub-Secret DATABASE_URL synchronisieren (best effort) =="
          if [ -n "$GH_PAT" ]; then
            GH_TOKEN="$GH_PAT" gh secret set DATABASE_URL --body "$NEWURL" -R "$GITHUB_REPOSITORY" \
              && echo "Secret DATABASE_URL aktualisiert." \
              || echo "WARNUNG: Secret-Update fehlgeschlagen (db-migrate.yml laeuft kuenftig gegen alte URL)."
          fi

          echo "== [5/6] Render-Env: nur DATABASE_URL schwenken =="
          export NEWURL SVC RENDER_API_KEY
          python3 - <<'PYEOF'
          import json, os, urllib.request

          svc, key, newurl = os.environ["SVC"], os.environ["RENDER_API_KEY"], os.environ["NEWURL"]

          def call(url, method="GET", data=None):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"}, method=method,
                                           data=json.dumps(data).encode() if data is not None else None)
              with urllib.request.urlopen(req, timeout=40) as r:
                  return json.load(r)

          cur = call(f"https://api.render.com/v1/services/{svc}/env-vars?limit=100")
          entries = []
          seen = set()
          for e in cur:
              kv = e.get("envVar") or e
              k = kv.get("key")
              if not k or k in seen:
                  continue
              seen.add(k)
              entries.append({"key": k, "value": newurl if k == "DATABASE_URL" else kv.get("value")})

          by_key = {e["key"]: e for e in entries}
          required = ["DATABASE_URL", "JWT_SECRET", "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET"]
          missing = [k for k in required if not by_key.get(k, {}).get("value")]
          if missing:
              raise SystemExit("ABBRUCH: Service-Env unvollstaendig/leer: " + ", ".join(missing))
          if any(e["value"] is None for e in entries):
              raise SystemExit("ABBRUCH: Ein Env-Wert lies sich nicht lesen (sync-Var?) — kein PUT.")

          call(f"https://api.render.com/v1/services/{svc}/env-vars", "PUT", entries)
          after = call(f"https://api.render.com/v1/services/{svc}/env-vars?limit=100")
          after_keys = sorted((a.get("envVar") or a).get("key") for a in after)
          assert after_keys == sorted(seen), "Abweichung nach PUT: " + str(sorted(set(after_keys) ^ set(seen)))
          print(f"  {len(entries)} Variablen gesetzt, DATABASE_URL geschwenkt, Liste identisch.")
          PYEOF

          echo "== [6/6] Deploy anstossen =="
          DEPID=$(curl -sf -X POST -H "$RAUTH" -H "Content-Type: application/json" "$API/services/$SVC/deploys" \
            -d '{"clearCache":"do_not_clear"}' | jq -r '.id')
          echo "Deploy: $DEPID"
          for i in $(seq 1 30); do
            sleep 20
            ST=$(curl -sf -H "$RAUTH" "$API/services/$SVC/deploys/$DEPID" | jq -r '.status // "?"')
            echo "  Deploy-Status: $ST"
            case "$ST" in live) break;; build_failed|update_failed|canceled|pre_deploy_failed) echo "ABBRUCH: Deploy fehlgeschlagen."; exit 1;; esac
          done

          echo "== Live-Verifikation =="
          for i in $(seq 1 12); do
            H=$(curl -s -m 60 "https://agenten-villa.onrender.com/api/health")
            DBST=$(echo "$H" | jq -r '.database.status // "?"')
            echo "  /api/health database: $DBST"
            [ "$DBST" = "ok" ] && break
            sleep 20
          done
          curl -s -m 60 "https://agenten-villa.onrender.com/api/trpc/auth.me" | jq -c '.result.data.json | if . == null then "auth.me: null (Login noch erforderlich)" else {id, openId, role, name} end'
