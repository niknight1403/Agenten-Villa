# Legt die 24/7-Master-Mission (CyberSarah-Control-Center) als startbare
# Elite-Mission in der Neon-Datenbank an: Status 'interrupted', damit der
# Administrator sie in der Villa-Oberflaeche mit einem Klick (Neustart)
# startet. Idempotent ueber (userId, idempotencyKey).
name: seed-master-mission
on:
  workflow_dispatch:

jobs:
  seed:
    name: Master-Mission anlegen (idempotent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Dependencies installieren
        run: pnpm install --frozen-lockfile
      - name: Mission anlegen
        run: pnpm exec tsx scripts/seed-master-mission.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Verifikation
        run: |
          node -e "
          const postgres = require('postgres');
          const sql = postgres(process.env.DATABASE_URL, { ssl: 'require' });
          (async () => {
            const rows = await sql\`SELECT id, status FROM elite_mission_runs WHERE \"idempotencyKey\" = 'master-24-7-csc-001'\`;
            if (rows.length !== 1) { console.error('Erwartet: 1 Mission, gefunden:', rows.length); process.exit(1); }
            console.log('Mission in der Live-DB:', JSON.stringify(rows[0]));
            await sql.end();
          })().catch(e => { console.error('Verifikations-Fehler:', e.message); process.exit(1); });
          "
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
