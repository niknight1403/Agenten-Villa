name: Ollama Deep-Smoke (Inhalt, alle Modelle)

# Beweist, dass jedes Ollama-Modell auf der Oracle-VM mit echtem Text antwortet
# (nicht nur Modellliste) und misst die Latenz. Token kommt aus VILLA_OLLAMA_TOKEN.
on:
  workflow_dispatch:

jobs:
  deepsmoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OLLAMA_BASE_URL: https://ollama.cybersarah-ki.com/v1
      OLLAMA_TOKEN: ${{ secrets.VILLA_OLLAMA_TOKEN }}
    steps:
      - name: Jedes Modell mit 400 Tokens pruefen
        run: |
          set -uo pipefail
          curl -s -m 30 -H "Authorization: Bearer $OLLAMA_TOKEN" "$OLLAMA_BASE_URL/models" > /tmp/m.json
          for model in $(python3 -c "import json;print(' '.join(m['id'] for m in json.load(open('/tmp/m.json'))['data']))"); do
            echo "=== $model ==="
            start=$(date +%s)
            code=$(curl -s -o /tmp/c.json -w "%{http_code}" -m 420 \
              -H "Authorization: Bearer $OLLAMA_TOKEN" -H "content-type: application/json" \
              -d "{\"model\":\"$model\",\"max_tokens\":400,\"messages\":[{\"role\":\"user\",\"content\":\"Antworte in einem Satz auf Deutsch: Was ist 12 mal 12?\"}]}" \
              "$OLLAMA_BASE_URL/chat/completions")
            echo "HTTP $code in $(( $(date +%s) - start ))s"
            python3 - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/c.json')); m=d['choices'][0]['message']
              print('content:', repr((m.get('content') or '')[:200]))
              print('reasoning-len:', len(m.get('reasoning') or ''), '| finish:', d['choices'][0].get('finish_reason'), '| usage:', d.get('usage'))
          except Exception as e:
              print('PARSE-FEHLER', e, open('/tmp/c.json').read()[:300])
          PY
          done
