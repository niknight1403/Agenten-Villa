name: DB Migrate

# Sprint 072 — Datenbankmigrationen ohne SSH: Der Workflow installiert die
# Abhängigkeiten und wendet alle ausstehenden Drizzle-Migrationen auf die
# Neon-Datenbank an. DATABASE_URL kommt aus den verschlüsselten
# Repository-Secrets und wird nie ins Log geschrieben.

on:
  workflow_dispatch:

jobs:
  migrate:
    name: Drizzle-Migrationen anwenden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Migrationen anwenden (drizzle-kit generate + migrate)
        run: pnpm db:push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Schema-Diagnose (nur Spaltennamen, keine Secrets im Log)
        run: |
          node -e "
          const postgres = require('postgres');
          const sql = postgres(process.env.DATABASE_URL, { ssl: 'require' });
          (async () => {
            const cols = await sql\`SELECT column_name FROM information_schema.columns WHERE table_name = 'villas' ORDER BY column_name\`;
            console.log('villas-Spalten:', cols.map(c => c.column_name).join(', '));
            const host = new URL(process.env.DATABASE_URL).host;
            console.log('DB-Host (gekürzt):', host.replace(/^([a-z0-9-]{0,12}).*/, '\$1…'));
            await sql.end();
          })().catch(e => { console.error('Diagnose-Fehler:', e.message); process.exit(1); });
          "
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
