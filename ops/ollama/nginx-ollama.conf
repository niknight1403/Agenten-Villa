# Agenten-Villa — Ollama-TLS-Proxy (Sprint 082)
# Platzhalter __DOMAIN__ / __TOKEN__ ersetzt setup-oracle-free.sh auf dem Server.
# Das Token existiert nur in dieser Datei auf der VM — niemals committen.

map_hash_bucket_size 128;

map $http_authorization $ollama_auth_ok {
    default 0;
    "Bearer __TOKEN__" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # certbot ergaenzt hier 443 + Zertifikat (setup-Skript ruft --nginx auf)
    client_max_body_size 32m;

    location / {
        if ($ollama_auth_ok = 0) {
            return 401;
        }
        proxy_pass http://127.0.0.1:11434;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Lokale 27B-Inferenz ist langsam — grosszuegige Timeouts:
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}
